# This file is intended to be deployed on the remote Docker host (10.0.10.102)
# Copy to /home/user/scopefoundry/ on the remote host and run:
#   docker-compose -f docker-compose.remote.yml up -d postgres

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scopefoundry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scopefoundry
      POSTGRES_USER: scopeuser
      POSTGRES_PASSWORD: scopepass_dev
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_pricebook.sql:/docker-entrypoint-initdb.d/001_create_pricebook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeuser -d scopefoundry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
