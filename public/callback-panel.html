<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer follow-up</title>
  <link rel="stylesheet" href="callback-panel.css?v=6" />
</head>
<body>
  <main class="panel">
    <header><p class="eyebrow">Customer engagement</p><h1>Customer follow-up</h1><p id="customer" class="customer">Loading customer...</p></header>
    <div id="identity" class="notice" hidden></div>
    <a id="crmLink" class="crm-link" href="#" target="_blank" rel="noreferrer" hidden>Open CRM Contact</a>
    <button id="callBtn" type="button" class="call-btn" hidden>Call via 3CX</button>
    <section id="confirmCustomer" class="confirm-card" hidden>
      <h2>Confirm customer</h2>
      <p id="confirmText" class="confirm-text"></p>
      <button id="confirmCustomerBtn" type="button">Link this CRM customer</button>
    </section>
    <section id="parkCustomer" class="confirm-card" hidden>
      <h2>Park for later</h2>
      <p id="parkText" class="confirm-text"></p>
      <label>Task title<input id="parkTaskTitle" name="parkTaskTitle" placeholder="Identify customer and follow up" /></label>
      <div class="due-grid">
        <label>Due date<input id="parkDueDate" name="parkDueDate" type="date" /></label>
        <label>Time<input id="parkDueTime" name="parkDueTime" type="text" inputmode="text" autocomplete="off" placeholder="3pm or 3:30 PM" /></label>
      </div>
      <div class="quick-times" data-date-target="parkDueDate" data-time-target="parkDueTime">
        <button type="button" data-day="today" data-time="4:00 PM">Today 4 PM</button>
        <button type="button" data-day="tomorrow" data-time="9:00 AM">Tomorrow 9 AM</button>
        <button type="button" data-day="tomorrow" data-time="1:00 PM">Tomorrow 1 PM</button>
      </div>
      <p class="timezone">Pacific time</p>
      <label>Notes<textarea id="parkTaskDetails" name="parkTaskDetails" rows="3" placeholder="What do you need to research before following up?"></textarea></label>
      <button id="parkCustomerBtn" type="button">Park for later</button>
    </section>
    <section id="openCallbacks" hidden><h2>Open callbacks</h2><ul id="callbackList"></ul></section>
    <div id="customerNameField" class="name-fields shared-fields" hidden>
      <label>First name<input id="firstName" name="firstName" autocomplete="given-name" /></label>
      <label>Last name<input id="lastName" name="lastName" autocomplete="family-name" /></label>
    </div>
    <nav id="tabs" class="tabs" hidden>
      <button type="button" class="tab is-active" data-tab="callback">Callback</button>
      <button type="button" class="tab" data-tab="task">Task</button>
    </nav>
    <form id="callbackForm" hidden>
      <p id="owner" class="owner" hidden></p>
      <div class="due-grid">
        <label>Due date<input id="dueDate" name="dueDate" type="date" required /></label>
        <label>Time<input id="dueTime" name="dueTime" type="text" inputmode="text" autocomplete="off" required placeholder="3pm or 3:30 PM" /></label>
      </div>
      <div class="quick-times" data-date-target="dueDate" data-time-target="dueTime">
        <button type="button" data-day="today" data-time="4:00 PM">Today 4 PM</button>
        <button type="button" data-day="tomorrow" data-time="9:00 AM">Tomorrow 9 AM</button>
        <button type="button" data-day="tomorrow" data-time="1:00 PM">Tomorrow 1 PM</button>
      </div>
      <p class="timezone">Pacific time</p>
      <label>Reason<textarea id="reason" name="reason" rows="3" required placeholder="What needs to happen on this callback?"></textarea></label>
      <button id="submit" type="submit">Schedule callback</button>
    </form>
    <form id="taskForm" hidden>
      <p id="taskOwner" class="owner" hidden></p>
      <label>Task title<input id="taskTitle" name="taskTitle" required placeholder="Research and call customer back" /></label>
      <div class="due-grid">
        <label>Due date<input id="taskDueDate" name="taskDueDate" type="date" required /></label>
        <label>Time<input id="taskDueTime" name="taskDueTime" type="text" inputmode="text" autocomplete="off" required placeholder="3pm or 3:30 PM" /></label>
      </div>
      <div class="quick-times" data-date-target="taskDueDate" data-time-target="taskDueTime">
        <button type="button" data-day="today" data-time="4:00 PM">Today 4 PM</button>
        <button type="button" data-day="tomorrow" data-time="9:00 AM">Tomorrow 9 AM</button>
        <button type="button" data-day="tomorrow" data-time="1:00 PM">Tomorrow 1 PM</button>
      </div>
      <p class="timezone">Pacific time</p>
      <label>Details<textarea id="taskDetails" name="taskDetails" rows="4" placeholder="What do you need to remember before following up?"></textarea></label>
      <button id="taskSubmit" type="submit">Create task</button>
    </form>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="callback-panel.js?v=9"></script>
</body>
</html>
